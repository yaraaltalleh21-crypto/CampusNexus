<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus360 — Smart University Facilities Management</title>
<style>
*{box-sizing:border-box}
:root{
  --acc:#4f8a7b;
  --acc-hover:#3f7265;
  --side:#1f3a34;
  --side-hover:#2a4a42;
  --mut:#7a8a83;
  --line:#e4ebe7;
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#23302b;
  --gold:#c9a96e;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  transition:background .25s ease, color .25s ease;
}

/* Layout */
.app{display:flex;min-height:100vh}

/* Sidebar */
.side{
  width:230px;
  background:var(--side);
  color:#dbe7e2;
  padding:20px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  z-index:20;
  transition:transform .25s ease;
  user-select:none;
}
.brand{
  font-size:19px;
  font-weight:700;
  padding:4px 10px 18px;
  color:#fff;
  display:flex;
  align-items:center;
  gap:8px;
  letter-spacing:-0.2px;
}
.brand b{color:var(--gold)}
.brand .logo-icon{font-size:22px}

.nav{
  background:none;
  color:#b9cbc4;
  text-align:left;
  padding:10px 12px;
  border-radius:10px;
  display:flex;
  gap:10px;
  align-items:center;
  font-size:14px;
  font-weight:500;
  border:0;
  cursor:pointer;
  transition:background .18s, color .18s;
  width:100%;
}
.nav:hover{background:var(--side-hover);color:#fff}
.nav.on{background:var(--acc);color:#fff;font-weight:600}
.nav span{font-size:16px;width:20px;text-align:center;display:inline-block}
.nav em{
  margin-left:auto;
  background:var(--gold);
  color:#1f3a34;
  border-radius:10px;
  padding:1px 7px;
  font-style:normal;
  font-size:11px;
  font-weight:700;
}

.side-foot{
  margin-top:auto;
  font-size:11.5px;
  color:#8fa79f;
  padding:10px 8px 4px;
  border-top:1px solid rgba(255,255,255,0.08);
}
.side-foot .foot-acts{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:8px;
}
.side-foot button{
  background:#2a4a42;
  color:#dbe7e2;
  padding:6px 10px;
  font-size:12px;
  border-radius:8px;
  text-align:center;
}
.side-foot button:hover{background:#355c52;color:#fff}

/* Main Content Area */
main{margin-left:230px;flex:1;min-width:0;display:flex;flex-direction:column}

/* Top Sticky Header */
.top{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(243,246,244,.95);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 28px;
  border-bottom:1px solid var(--line);
  transition:background .25s ease, border-color .25s ease;
}
.top h1{font-size:19px;margin:0;flex:1;font-weight:650;letter-spacing:-0.2px}
.top-actions{display:flex;align-items:center;gap:10px}

.burger{
  display:none;
  font-size:18px;
  padding:6px 10px;
  background:#eef3f0;
  color:#1f3a34;
  border-radius:8px;
}

.theme-toggle{
  background:var(--card);
  color:inherit;
  border:1px solid var(--line);
  padding:7px 11px;
  border-radius:10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  font-weight:500;
}
.theme-toggle:hover{background:#eef3f0}

/* Body */
.body{padding:24px 28px;display:flex;flex-direction:column;gap:18px}

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 20px;
  min-width:0;
  transition:box-shadow .2s ease, background .25s ease, border-color .25s ease;
}
.card:hover{box-shadow:0 3px 14px rgba(0,0,0,0.04)}
.card h2{
  font-size:15px;
  margin:0 0 14px;
  font-weight:650;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

/* Grids */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}

/* Stat Cards */
.stat{display:flex;gap:14px;align-items:center}
.stat .ic{
  width:46px;
  height:46px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:22px;
  flex:none;
  transition:transform .2s;
}
.stat:hover .ic{transform:scale(1.06)}
.stat .v{font-size:24px;font-weight:700;line-height:1.2}
.stat .l{color:var(--mut);font-size:12.5px;font-weight:500;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--mut);margin-top:1px}

/* Buttons */
button{
  font:inherit;
  cursor:pointer;
  border-radius:9px;
  padding:8px 14px;
  border:0;
  background:var(--acc);
  color:#fff;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:background .15s, transform .1s;
}
button:hover{background:var(--acc-hover)}
button:active{transform:scale(0.98)}
button.ghost{
  background:#eef3f0;
  color:#2f4a42;
  padding:6px 11px;
  font-size:13px;
  font-weight:500;
}
button.ghost:hover{background:#dfe9e4}
button.danger{color:#b1483f;background:#fdf2f1}
button.danger:hover{background:#fbe4e2}
button.danger-solid{background:#c4625a;color:#fff}
button.danger-solid:hover{background:#b1483f}
button.success-ghost{background:#edf6f0;color:#357a4a}
button.success-ghost:hover{background:#ddede2}

/* Inputs & Form */
input,select,textarea{
  font:inherit;
  border:1px solid #d5dfda;
  border-radius:9px;
  padding:8px 11px;
  background:#fff;
  color:inherit;
  min-width:0;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--acc);
  box-shadow:0 0 0 3px rgba(79,138,123,0.18);
}
.bar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-row input{flex:1;min-width:200px}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;
  color:var(--mut);
  font-weight:600;
  font-size:12px;
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  user-select:none;
}
th.sortable{cursor:pointer;position:relative;padding-right:20px}
th.sortable:hover{color:var(--acc)}
th.sortable::after{
  content:"\21C5";
  position:absolute;
  right:4px;
  top:50%;
  transform:translateY(-50%);
  font-size:11px;
  opacity:0.35;
}
th.sortable.asc::after{content:"\25B2";opacity:0.9;color:var(--acc)}
th.sortable.desc::after{content:"\25BC";opacity:0.9;color:var(--acc)}

td{
  padding:10px 10px;
  border-bottom:1px solid #f0f4f2;
  vertical-align:middle;
  transition:background .15s;
}
tr:hover td{background:rgba(79,138,123,0.03)}
tr.sel td{background:#f3f8f6}
tr.dmg td{background:#fdf5f4}
.wrap{overflow-x:auto}
.acts-c{white-space:nowrap;text-align:right}
.acts-c button{margin-left:4px}
.inl{padding:4px 8px;font-size:12.5px;border-radius:7px}

/* Badges */
.badge{
  display:inline-block;
  padding:3px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  background:color-mix(in srgb,var(--t) 14%,transparent);
  color:var(--t);
  white-space:nowrap;
}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{
  background:#fff;
  color:var(--mut);
  border:1px solid var(--line);
  padding:6px 12px;
  font-size:13px;
  border-radius:9px;
}
.tabs button:hover{background:#f7faf8}
.tabs button.on{
  background:var(--acc);
  color:#fff;
  border-color:var(--acc);
  font-weight:600;
}

/* Chart Bars */
.bars{display:flex;align-items:flex-end;gap:12px;height:210px;padding-top:14px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{
  width:100%;
  max-width:54px;
  background:linear-gradient(180deg,#6fa597,#4f8a7b);
  border-radius:7px 7px 3px 3px;
  min-height:4px;
  transition:height .45s ease;
}
.bv{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.bl{font-size:12px;font-weight:500;margin-top:6px;color:var(--mut);text-align:center}

/* Donut Chart */
.donut{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.lg div{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}

/* Lists */
.list .it{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #f0f4f2;align-items:flex-start}
.list .it:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.muted{color:var(--mut);font-size:12px}

/* Bell & Notifications Dropdown */
.bellw{position:relative}
.bell{
  background:var(--card);
  color:inherit;
  border:1px solid var(--line);
  padding:7px 11px;
  position:relative;
  font-size:15px;
  border-radius:9px;
}
.bell:hover{background:#eef3f0}
.bell i{
  position:absolute;
  top:-6px;
  right:-6px;
  background:#c4625a;
  color:#fff;
  font-style:normal;
  font-size:10.5px;
  font-weight:700;
  border-radius:10px;
  padding:1px 6px;
  line-height:1.2;
}
.dd{
  position:absolute;
  right:0;
  top:46px;
  width:320px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 12px 36px rgba(0,0,0,0.12);
  padding:10px;
  z-index:30;
  animation:pop-in .18s ease;
}
.dd-head{font-weight:650;font-size:13.5px;padding:4px 8px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ddi{padding:9px 8px;font-size:12.5px;border-bottom:1px solid #f0f4f2;display:flex;align-items:center;gap:8px}
.dd-foot{padding:8px 8px 4px;text-align:center}
.dd-foot button{width:100%}

/* Avatar */
.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--gold);
  color:#1f3a34;
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:12.5px;
  user-select:none;
}

/* Modals */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(20,35,30,.4);
  backdrop-filter:blur(3px);
  display:grid;
  place-items:center;
  z-index:50;
  padding:16px;
  animation:fade-in .18s ease;
}
.modal{
  background:var(--card);
  border-radius:16px;
  width:min(500px,100%);
  padding:22px;
  max-height:90vh;
  overflow-y:auto;
  box-shadow:0 18px 44px rgba(0,0,0,0.16);
  animation:pop-in .2s ease;
}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh h3{margin:0;font-size:17px;font-weight:650}
.modal form{display:grid;gap:13px}
.modal label{display:grid;gap:5px;font-size:12.5px;color:var(--mut);font-weight:500}
.modal label input, .modal label select, .modal label textarea{color:var(--text)}
.field-error{color:#b1483f !important}
.field-error input, .field-error select, .field-error textarea{border-color:#b1483f !important}
.err-msg{color:#b1483f;font-size:11.5px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

/* Confirm Dialog */
.confirm-box{
  background:var(--card);
  border-radius:14px;
  width:min(380px,100%);
  padding:22px;
  text-align:center;
  box-shadow:0 18px 44px rgba(0,0,0,0.18);
  animation:pop-in .2s ease;
}
.confirm-icon{font-size:32px;margin-bottom:10px}
.confirm-box h3{margin:0 0 6px;font-size:16px;font-weight:650}
.confirm-box p{margin:0 0 18px;color:var(--mut);font-size:13.5px}

/* Floor explorer */
.floors{display:grid;gap:10px}
.floor{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  background:#f7faf8;
  padding:11px;
  border-radius:10px;
}
.floor b{min-width:76px;font-size:13px;color:var(--mut)}
.chip{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:9px;
  padding:5px 9px;
  display:flex;
  gap:8px;
  align-items:center;
  font-size:12.5px;
}

/* Detail Grid */
.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  background:#f7faf8;
  padding:14px;
  border-radius:10px;
}

/* Toast */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:#1f3a34;
  color:#fff;
  padding:10px 20px;
  border-radius:10px;
  z-index:60;
  font-size:13.5px;
  font-weight:500;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
  animation:toast-in .25s ease;
}

/* Pagination */
.pagination{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px 0 6px;
  font-size:13px;
  color:var(--mut);
}

.empty{text-align:center;color:var(--mut);padding:36px;font-size:14px}
.scrim{display:none}

/* Animations */
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes pop-in{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.fade-in{animation:fade-in .2s ease}

/* Dark Mode Theme */
body.dark{
  --acc:#559c8c;
  --acc-hover:#47887a;
  --side:#121a17;
  --side-hover:#1c2723;
  --mut:#8fa39b;
  --line:#2a3631;
  --bg:#17201c;
  --card:#1f2b26;
  --text:#deebe4;
}
body.dark .top{
  background:rgba(23,32,28,.95);
  border-bottom-color:var(--line);
}
body.dark .top h1{color:#fff}
body.dark td{border-bottom-color:#26342e}
body.dark tr:hover td{background:rgba(85,156,140,0.06)}
body.dark tr.sel td{background:#263630}
body.dark tr.dmg td{background:#382725}
body.dark input,body.dark select,body.dark textarea{
  background:#1a2420;
  border-color:#33443e;
  color:var(--text);
}
body.dark button.ghost{background:#293731;color:#bcd2c8}
body.dark button.ghost:hover{background:#32443d}
body.dark button.danger{background:#382725;color:#e88078}
body.dark button.success-ghost{background:#24362a;color:#7ed698}
body.dark .tabs button{background:#1f2b26;border-color:var(--line);color:var(--mut)}
body.dark .tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
body.dark .floor, body.dark .detail-grid{background:#1a2520}
body.dark .chip{background:var(--card);border-color:var(--line)}
body.dark .burger{background:#293731;color:#deebe4}
body.dark .dd{background:var(--card);border-color:var(--line);box-shadow:0 12px 36px rgba(0,0,0,0.4)}
body.dark .ddi{border-bottom-color:#2a3631}
body.dark .toast{background:#0b110f;color:#deebe4;border:1px solid #2a3631}

/* Responsive Media Queries */
@media(max-width:1000px){
  .grid4{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:860px){
  .side{transform:translateX(-100%)}
  .navopen .side{transform:none}
  .navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
  main{margin-left:0}
  .burger{display:inline-flex}
  .body{padding:16px}
  .top{padding:12px 16px}
}
@media(max-width:560px){
  .grid4{grid-template-columns:1fr}
  .bar-row input{min-width:140px}
}

/* Print Styles */
@media print{
  .side,.top,.burger,.scrim,.toast,.overlay,.acts-c,.bar-row,.pagination{display:none!important}
  main{margin-left:0!important}
  .body{padding:0!important}
  .card{border:1px solid #ccc;box-shadow:none!important;break-inside:avoid}
  body{background:#fff;color:#000}
}

</style>
</head>

<div id="root"></div>

<!-- Main React Application -->
<script type="text/babel">
/* ============================================================

const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ---------- Utilities ---------- */

const byPri = (a, b) => PRI.indexOf(a.priority) - PRI.indexOf(b.priority);

/* ---------- Seed Data ---------- */
const SEED = {

    { code: 'IS-110', name: 'Physics Lab', type: 'Laboratory', building: 'IS', floor: 1, capacity: 24, status: 'Available' },

/* ---------- Custom Hooks ---------- */
function useSort(defaultKey = '', defaultDir = 'asc') {
  const [sortKey, setSortKey] = useState(defaultKey);
  const [sortDir, setSortDir] = useState(defaultDir);

  const toggle = key => {
    if (sortKey === key) {
      setSortDir(d => (d === 'asc' ? 'desc' : 'asc'));
    } else {
      setSortKey(key);
      setSortDir('asc');
    }
  };

  const sortFn = useCallback(
    (list, getVal) => {
      if (!sortKey) return list;
      return [...list].sort((a, b) => {
        let va = getVal ? getVal(a, sortKey) : a[sortKey];
        let vb = getVal ? getVal(b, sortKey) : b[sortKey];
        if (va == null) va = '';
        if (vb == null) vb = '';
        if (typeof va === 'number' && typeof vb === 'number') {
          return sortDir === 'asc' ? va - vb : vb - va;
        }
        return sortDir === 'asc'
          ? String(va).localeCompare(String(vb), undefined, { numeric: true })
          : String(vb).localeCompare(String(va), undefined, { numeric: true });
      });
    },
    [sortKey, sortDir]
  );

  const thProps = key => ({
    className: 'sortable' + (sortKey === key ? (sortDir === 'asc' ? ' asc' : ' desc') : ''),
    onClick: () => toggle(key)
  });

  return { sortKey, sortDir, sortFn, thProps };
}

function usePagination(items, perPage = 10) {
  const [page, setPage] = useState(0);
  const totalPages = Math.max(1, Math.ceil(items.length / perPage));
  const safeP = Math.min(page, totalPages - 1);
  const paged = items.slice(safeP * perPage, (safeP + 1) * perPage);

  useEffect(() => {
    if (page >= totalPages) setPage(Math.max(0, totalPages - 1));
  }, [items.length, totalPages, page]);

  const Pager = () => {
    if (totalPages <= 1) return null;
    return (
      <div className="pagination">
        <button className="ghost" disabled={safeP === 0} onClick={() => setPage(safeP - 1)}>
          ‹ Prev
        </button>
        <span>
          Page {safeP + 1} of {totalPages} ({items.length} items)
        </span>
        <button className="ghost" disabled={safeP >= totalPages - 1} onClick={() => setPage(safeP + 1)}>
          Next ›
        </button>
      </div>
    );
  };

  return { paged, Pager, setPage };
}

const Bars = ({ data }) => {
  const m = Math.max(...data.map(d => d.v), 1);
  return (
    <div className="bars">
      {data.map(d => (
        <div className="bc" key={d.l}>
          <div className="bv">{d.v}</div>
          <div className="bar" style={{ height: Math.max((d.v / m) * 140, 4) + 'px' }} />
          <div className="bl">{d.l}</div>
        </div>
      ))}
    </div>
  );
};

const Donut = ({ parts }) => {
  const tot = parts.reduce((a, p) => a + p.v, 0);
  const C = 2 * Math.PI * 40;
  let acc = 0;
  return (
    <div className="donut">
      <svg width="150" height="150" viewBox="0 0 120 120">
        <g transform="rotate(-90 60 60)">
          {parts.map(p => {
            const L = tot ? (p.v / tot) * C : 0;
            const el = (
              <circle
                key={p.l}
                cx="60"
                cy="60"
                r="40"
                fill="none"
                stroke={p.c}
                strokeWidth="16"
                strokeDasharray={`${L} ${C - L}`}
                strokeDashoffset={-acc}
              />
            );
            acc += L;
            return el;
          })}
        </g>
        <text x="60" y="66" textAnchor="middle" fontSize="18" fontWeight="700" fill="currentColor">
          {tot}
        </text>
      </svg>
      <div className="lg">
        {parts.map(p => (
          <div key={p.l}>
            <i style={{ background: p.c }} />
            {p.l}: <b>{p.v}</b>
          </div>
        ))}
      </div>
    </div>
  );
};

function Modal({ title, onClose, children }) {
  useEffect(() => {
    const handler = e => {
      if (e.key === 'Escape') onClose();
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="mh">
          <h3>{title}</h3>
          <button className="ghost" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ConfirmDialog({ message, onConfirm, onCancel }) {
  return (
    <div className="overlay" onClick={onCancel}>
      <div className="confirm-box" onClick={e => e.stopPropagation()}>
        <div className="confirm-icon">⚠️</div>
        <h3>Confirm Action</h3>
        <p>{message}</p>
        <div className="acts">
          <button className="ghost" onClick={onCancel}>Cancel</button>
          <button className="danger-solid" onClick={onConfirm}>Confirm Delete</button>
        </div>
      </div>
    </div>
  );
}

function FormModal({ title, fields, init, onSave, onClose }) {
  const [f, setF] = useState(() => ({
    ...Object.fromEntries(fields.filter(x => x.opts).map(x => [x.k, x.opts[0]])),
    ...init
  }));
  const [errors, setErrors] = useState({});

  const validate = () => {
    const errs = {};
    fields.forEach(x => {
      if (!x.opts && !x.area && (f[x.k] === undefined || f[x.k] === '')) {
        errs[x.k] = 'This field is required';
      }
    });
    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const handleSubmit = e => {
    e.preventDefault();
    if (!validate()) return;
    if (onSave(f) !== false) {
      onClose();
    }
  };

  return (
    <Modal title={title} onClose={onClose}>
      <form onSubmit={handleSubmit}>
        {fields.map(x => (
          <label key={x.k} className={errors[x.k] ? 'field-error' : ''}>
            {x.l}
            {x.opts ? (
              <select value={f[x.k] ?? ''} onChange={e => setF({ ...f, [x.k]: e.target.value })}>
                {x.opts.map(o => (
                  <option key={o} value={o}>
                    {o}
                  </option>
                ))}
              </select>
            ) : x.area ? (
              <textarea
                rows="3"
                value={f[x.k] ?? ''}
                onChange={e => setF({ ...f, [x.k]: e.target.value })}
              />
            ) : (
              <input
                type={x.t || 'text'}
                value={f[x.k] ?? ''}
                onChange={e => {
                  setF({ ...f, [x.k]: x.t === 'number' ? +e.target.value : e.target.value });
                  if (errors[x.k]) setErrors({ ...errors, [x.k]: undefined });
                }}
              />
            )}
            {errors[x.k] && <span className="err-msg">{errors[x.k]}</span>}
          </label>
        ))}
        <div className="acts">
          <button type="button" className="ghost" onClick={onClose}>
            Cancel
          </button>
          <button type="submit">Save Record</button>
        </div>
      </form>
    </Modal>
  );
}

function Buildings({ db, mutate, notify, go, reserve }) {
  const [q, setQ] = useState('');
  const [st, setSt] = useState('All');
  const [sel, setSel] = useState(null);
  const [m, setM] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const { sortFn, thProps } = useSort('code');

  const list = db.buildings.filter(
    b =>
      (st === 'All' || b.status === st) &&
      (b.name + b.code + b.status).toLowerCase().includes(q.toLowerCase())
  );

  const sorted = sortFn(list, (item, key) => {
    if (key === 'rooms') return db.rooms.filter(r => r.building === item.code).length;
    return item[key];
  });

  const save = v => {
    const isNew = !db.buildings.some(b => b.code.toUpperCase() === v.code.toUpperCase());
    const upperCode = v.code.toUpperCase().trim();
    const cleanItem = { ...v, code: upperCode };
    mutate(
      d => ({
        ...d,
        buildings: isNew
          ? [...d.buildings, cleanItem]
          : d.buildings.map(b => (b.code === cleanItem.code ? { ...b, ...cleanItem } : b))
      }),
      `${isNew ? 'Building added' : 'Building updated'}: ${cleanItem.name} (${cleanItem.code})`
    );
    notify('Building details saved');
  };

  const del = b => {
    mutate(
      d => ({
        ...d,
        buildings: d.buildings.filter(x => x.code !== b.code),
        rooms: d.rooms.filter(r => r.building !== b.code)
      }),
      `Building deleted: ${b.name} (${b.code}) with associated rooms`
    );
    if (sel === b.code) setSel(null);
    notify('Building deleted');
    setConfirm(null);
  };

  const cur = db.buildings.find(b => b.code === sel);

  return (
    <div className="fade-in">

              <th {...thProps('name')}>Building Name</th>
              <th {...thProps('floors')}>Floors</th>
              <th {...thProps('year')}>Built Year</th>
              <th {...thProps('rooms')}>Total Rooms</th>
              <th {...thProps('status')}>Status</th>

                <td><b>{b.code}</b></td>
                <td>{b.name}</td>
                <td>{b.floors}</td>
                <td>{b.year}</td>
                <td>{db.rooms.filter(r => r.building === b.code).length}</td>
                <td><Badge v={b.status} /></td>
                <td className="acts-c">
                  <button className="ghost" onClick={() => setSel(sel === b.code ? null : b.code)}>
                    {sel === b.code ? 'Hide Floors' : 'View Floors'}
                  </button>
                  <button className="ghost" onClick={() => setM(b)}>Edit</button>
                  <button className="ghost danger" onClick={() => setConfirm(b)}>Delete</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {!sorted.length && <Empty />}
      </div>

      {cur && (
        <div className="card">
          <h2>
            <span>Floor & Room Map: {cur.name} ({cur.code})</span>
            <span className="muted" style={{ fontSize: 13, fontWeight: 'normal' }}>
              Click any room to book or inspect
            </span>
          </h2>
          <div className="floors">
            {Array.from({ length: cur.floors }, (_, i) => i).map(f => {
              const floorRooms = db.rooms.filter(r => r.building === cur.code && r.floor === f);
              return (
                <div key={f} className="floor">
                  <b>{f === 0 ? 'Ground' : `Floor ${f}`}</b>
                  {floorRooms.map(r => (
                    <div
                      key={r.code}
                      className="chip"
                      style={{ cursor: 'pointer' }}
                      title="Click to reserve"
                      onClick={() => reserve(r.code)}
                    >
                      <span><b>{r.code}</b> — {r.name} ({r.capacity} cap)</span>
                      <Badge v={r.status} />
                    </div>
                  ))}
                  {!floorRooms.length && <span className="muted">No rooms registered on this floor</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {m && (
        <FormModal
          title={m === 'new' ? 'Add New University Building' : `Edit Building: ${m.name}`}
          fields={m === 'new' ? BF : BF.filter(x => x.k !== 'code')}
          init={m === 'new' ? { floors: 4, year: 2020, status: 'Operational' } : m}
          onSave={save}
          onClose={() => setM(null)}
        />
      )}

      {confirm && (
        <ConfirmDialog
          message={`Are you sure you want to delete "${confirm.name}" (${confirm.code})? All associated classrooms, laboratories, and equipment references will also be permanently deleted.`}
          onConfirm={() => del(confirm)}
          onCancel={() => setConfirm(null)}
        />
      )}
    </div>
  );
}

function Rooms({ db, mutate, notify, type, reserve }) {

  const [st, setSt] = useState('All');
  const [bldFilter, setBldFilter] = useState('All');
  const [m, setM] = useState(null);

  const [confirm, setConfirm] = useState(null);
  const { sortFn, thProps } = useSort('code');
  const L = type === 'Laboratory';

  const list = db.rooms.filter(
    r =>
      r.type === type &&
      (st === 'All' || r.status === st) &&
      (bldFilter === 'All' || r.building === bldFilter) &&
      (r.code + r.name + r.building).toLowerCase().includes(q.toLowerCase())
  );

  const bname = c => db.buildings.find(b => b.code === c)?.name || c;

  const sorted = sortFn(list, (item, key) => {
    if (key === 'buildingName') return bname(item.building);
    if (key === 'equipment') {
      const eq = db.equipment.filter(e => e.room === item.code);
      return eq.filter(e => e.available).length;
    }
    return item[key];
  });

  const { paged, Pager } = usePagination(sorted, 10);

  const RF = [
    { k: 'code', l: 'Room Code (e.g. IS-110)' },
    { k: 'name', l: 'Room Name' },
    { k: 'building', l: 'Building', opts: db.buildings.map(b => b.code) },
    { k: 'floor', l: 'Floor Number (0 = Ground)', t: 'number' },
    { k: 'capacity', l: 'Seating / Student Capacity', t: 'number' },
    { k: 'status', l: 'Current Status', opts: ROOM_STATS }
  ];

  const save = v => {
    const upperCode = v.code.toUpperCase().trim();
    const isNew = !db.rooms.some(r => r.code === upperCode);
    const item = { ...v, code: upperCode, type };
    mutate(
      d => ({
        ...d,
        rooms: isNew ? [...d.rooms, item] : d.rooms.map(r => (r.code === upperCode ? { ...r, ...item } : r))
      }),
      `${isNew ? 'Room added' : 'Room updated'}: ${item.code} (${item.name})`
    );
    notify('Room saved successfully');
  };

  const del = r => {
    mutate(
      d => ({
        ...d,
        rooms: d.rooms.filter(x => x.code !== r.code),
        equipment: d.equipment.filter(e => e.room !== r.code),
        reservations: d.reservations.filter(res => res.room !== r.code)
      }),
      `Room deleted: ${r.code}`
    );
    notify('Room deleted');
    setConfirm(null);
  };

  const schedule = sch
    ? db.reservations
        .filter(r => r.room === sch)
        .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))
    : [];

  return (
    <div className="fade-in">

              {b.name} ({b.code})

        </select>
        <select value={st} onChange={e => setSt(e.target.value)}>
          <option value="All">All Statuses</option>

            <option key={s} value={s}>{s}</option>
          ))}
        </select>
      </Toolbar>

      <div className="card wrap">

            <tr>

              <th {...thProps('name')}>Name</th>
              <th {...thProps('buildingName')}>Building</th>
              {L ? <th {...thProps('equipment')}>Equipment Ready</th> : <th {...thProps('floor')}>Floor</th>}
              <th {...thProps('capacity')}>Capacity</th>
              <th {...thProps('status')}>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {paged.map(r => {
              const eq = db.equipment.filter(e => e.room === r.code);
              return (
                <tr key={r.code} className={sch === r.code ? 'sel' : ''}>
                  <td><b>{r.code}</b></td>

                  {L ? (
                    <td>
                      <span style={{ fontWeight: 600 }}>
                        {eq.filter(e => e.available).length} / {eq.length}
                      </span>{' '}
                      <span className="muted">available</span>
                    </td>
                  ) : (
                    <td>{r.floor === 0 ? 'Ground' : `Floor ${r.floor}`}</td>
                  )}
                  <td>{r.capacity} seats</td>
                  <td><Badge v={r.status} /></td>
                  <td className="acts-c">
                    <button className="ghost success-ghost" onClick={() => reserve(r.code)}>
                      Reserve
                    </button>
                    <button className="ghost" onClick={() => setSch(sch === r.code ? null : r.code)}>
                      {sch === r.code ? 'Hide Schedule' : 'Schedule'}
                    </button>
                    <button className="ghost" onClick={() => setM(r)}>Edit</button>
                    <button className="ghost danger" onClick={() => setConfirm(r)}>Delete</button>

        </table>
        {!sorted.length && <Empty />}
        <Pager />

        <div className="card">

            <span>Schedule & Bookings for {sch}</span>

                  <b>{r.date}</b> ({r.start} – {r.end})

                    {r.purpose} — Requested by {r.who}

}

function Equip({ db, mutate, notify }) {
  const [q, setQ] = useState('');
  const [cond, setCond] = useState('All');
  const [availFilter, setAvailFilter] = useState('All');
  const [m, setM] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const { sortFn, thProps } = useSort('id');

  const allRooms = db.rooms.map(r => r.code);

  const EF = [
    { k: 'name', l: 'Equipment Name & Model' },
    { k: 'room', l: 'Assigned Location (Room)', opts: allRooms },
    { k: 'condition', l: 'Physical Condition', opts: CONDITIONS },
    { k: 'service', l: 'Last Inspection / Service Date', t: 'date' }
  ];

  const list = db.equipment.filter(e => {
    const matchQ = (e.name + e.room + e.id).toLowerCase().includes(q.toLowerCase());
    const matchCond = cond === 'All' || e.condition === cond;
    const matchAvail =
      availFilter === 'All' ||
      (availFilter === 'Available' ? e.available : !e.available);
    return matchQ && matchCond && matchAvail;
  });

  const sorted = sortFn(list);
  const { paged, Pager } = usePagination(sorted, 10);

  const save = v => {
    const isNew = !db.equipment.some(e => e.id === v.id);
    const item = { ...v };
    if (isNew) {
      item.id = 'E' + (db.equipment.length + 1);
      item.available = item.condition !== 'Damaged';
    }
    mutate(
      d => ({
        ...d,
        equipment: isNew ? [...d.equipment, item] : d.equipment.map(e => (e.id === item.id ? { ...e, ...item } : e))
      }),
      `${isNew ? 'Equipment registered' : 'Equipment updated'}: ${item.name} (${item.id})`
    );
    notify('Equipment saved');
  };

  const del = e => {
    mutate(
      d => ({ ...d, equipment: d.equipment.filter(x => x.id !== e.id) }),
      `Equipment deleted: ${e.name} (${e.id})`
    );
    notify('Equipment removed');
    setConfirm(null);
  };

  const toggleAvail = e => {
    const nextState = !e.available;
    mutate(
      d => ({
        ...d,
        equipment: d.equipment.map(x => (x.id === e.id ? { ...x, available: nextState } : x))
      }),
      `${e.name} marked ${nextState ? 'available' : 'unavailable'}`
    );
    notify(nextState ? 'Marked as Available' : 'Marked as Unavailable');
  };

  const logService = e => {
    const t = today();
    mutate(
      d => ({
        ...d,
        equipment: d.equipment.map(x => (x.id === e.id ? { ...x, service: t, condition: 'Good' } : x))
      }),
      `Service recorded for ${e.name} on ${t}`
    );
    notify('Service logged for today (condition reset to Good)');
  };

  return (
    <div className="fade-in">
      <Toolbar q={q} setQ={setQ} onAdd={() => setM('new')} label="Add Equipment">
        <select value={cond} onChange={e => setCond(e.target.value)}>
          <option value="All">All Conditions</option>
          {CONDITIONS.map(s => (
            <option key={s} value={s}>{s}</option>
          ))}
        </select>
        <select value={availFilter} onChange={e => setAvailFilter(e.target.value)}>
          <option value="All">All Availability</option>
          <option value="Available">Available</option>
          <option value="Unavailable">Unavailable</option>
        </select>
      </Toolbar>

      <div className="card wrap">
        <table>
          <thead>
            <tr>
              <th {...thProps('id')}>ID</th>
              <th {...thProps('name')}>Equipment Name</th>
              <th {...thProps('room')}>Location</th>
              <th {...thProps('condition')}>Condition</th>
              <th>Availability</th>
              <th {...thProps('service')}>Last Service</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {paged.map(e => {
              const r = db.rooms.find(x => x.code === e.room);
              return (
                <tr key={e.id} className={e.condition === 'Damaged' ? 'dmg' : ''}>
                  <td><b>{e.id}</b></td>
                  <td>
                    <b>{e.name}</b>
                  </td>
                  <td>
                    <b>{e.room}</b>
                    {r && <div className="muted">{r.name}</div>}
                  </td>
                  <td><Badge v={e.condition} /></td>
                  <td>
                    <button
                      className={`ghost inl ${e.available ? 'success-ghost' : 'danger'}`}
                      onClick={() => toggleAvail(e)}
                      title="Click to toggle availability"
                    >
                      {e.available ? '✓ Available' : '✗ Unavailable'}
                    </button>
                  </td>
                  <td>{e.service}</td>
                  <td className="acts-c">
                    <button className="ghost" onClick={() => logService(e)}>
                      Log Service
                    </button>
                    <button className="ghost" onClick={() => setM(e)}>
                      Edit
                    </button>
                    <button className="ghost danger" onClick={() => setConfirm(e)}>
                      Delete
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {!sorted.length && <Empty />}
        <Pager />
      </div>

      {m && (
        <FormModal
          title={m === 'new' ? 'Register New University Equipment' : `Edit Equipment: ${m.name}`}
          fields={EF}
          init={
            m === 'new'
              ? { room: allRooms[0], condition: 'Good', service: today() }
              : m
          }
          onSave={save}
          onClose={() => setM(null)}
        />
      )}

      {confirm && (
        <ConfirmDialog
          message={`Delete equipment record "${confirm.name}" (${confirm.id})?`}
          onConfirm={() => del(confirm)}
          onCancel={() => setConfirm(null)}
        />
      )}
    </div>
  );
}

   PAGE: Maintenance
   ============================================================ */
function Maint({ db, mutate, notify }) {
  const [q, setQ] = useState('');
  const [fs, setFs] = useState('All');
  const [fp, setFp] = useState('All');
  const [fc, setFc] = useState('All');
  const [m, setM] = useState(null);
  const [detail, setDetail] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const { sortFn, thProps } = useSort('date', 'desc');

  const MF = [
    { k: 'title', l: 'Issue Title' },
    { k: 'cat', l: 'Facility Category', opts: CATS },
    { k: 'room', l: 'Location (Room)', opts: db.rooms.map(r => r.code) },
    { k: 'by', l: 'Reported By (Name / Role)' },
    { k: 'priority', l: 'Priority Level', opts: PRI },
    { k: 'status', l: 'Request Status', opts: STAT },
    { k: 'assignee', l: 'Assign Staff', opts: ['', ...STAFF] },
    { k: 'desc', l: 'Detailed Description of Problem', area: true }
  ];

  const list = db.requests.filter(x => {
    const matchS = fs === 'All' || x.status === fs;
    const matchP = fp === 'All' || x.priority === fp;
    const matchC = fc === 'All' || x.cat === fc;
    const matchQ = (x.title + x.room + x.cat + x.by + x.id).toLowerCase().includes(q.toLowerCase());
    return matchS && matchP && matchC && matchQ;
  });

  const sorted = sortFn(list, (item, key) => {
    if (key === 'priority') return PRI.indexOf(item.priority);
    return item[key];
  });
  const { paged, Pager } = usePagination(sorted, 10);

  const save = v => {
    const isNew = !db.requests.some(r => r.id === v.id);
    const item = { ...v };
    if (isNew) {
      item.id = 'M' + (db.requests.length + 1);
      item.date = today();
      if (!item.status) item.status = 'Pending';
      if (!item.assignee) item.assignee = '';
    }
    mutate(
      d => ({
        ...d,
        requests: isNew
          ? [item, ...d.requests]
          : d.requests.map(r => (r.id === item.id ? { ...r, ...item } : r))
      }),
      `${isNew ? 'Maintenance requested' : 'Maintenance updated'}: ${item.title} (${item.room})`
    );
    notify('Maintenance record saved');
  };

  const del = r => {
    mutate(
      d => ({ ...d, requests: d.requests.filter(x => x.id !== r.id) }),
      `Maintenance request removed: ${r.title}`
    );
    notify('Request deleted');
    setConfirm(null);
  };

  const updateField = (id, field, value) => {
    const req = db.requests.find(x => x.id === id);
    if (!req) return;
    const updates = { [field]: value };
    if (field === 'assignee' && value && req.status === 'Pending') {
      updates.status = 'In Progress';
    }
    mutate(
      d => ({
        ...d,
        requests: d.requests.map(x => (x.id === id ? { ...x, ...updates } : x))
      }),
      `${req.title}: ${field} changed to ${value || 'none'}`
    );
    notify(`Updated ${field}`);
  };

  return (
    <div className="fade-in">
      <Toolbar q={q} setQ={setQ} onAdd={() => setM('new')} label="New Maintenance Request">
        <select value={fp} onChange={e => setFp(e.target.value)}>
          <option value="All">All Priorities</option>
          {PRI.map(p => (
            <option key={p} value={p}>{p}</option>
          ))}
        </select>
        <select value={fc} onChange={e => setFc(e.target.value)}>
          <option value="All">All Categories</option>
          {CATS.map(c => (
            <option key={c} value={c}>{c}</option>
          ))}
        </select>
      </Toolbar>

      <div className="tabs">
        {['All', ...STAT].map(s => {
          const count = s === 'All' ? db.requests.length : db.requests.filter(x => x.status === s).length;
          return (
            <button key={s} className={fs === s ? 'on' : ''} onClick={() => setFs(s)}>
              {s} ({count})
            </button>
          );
        })}
      </div>

      <div className="card wrap">
        <table>
          <thead>
            <tr>
              <th {...thProps('id')}>ID</th>
              <th {...thProps('title')}>Issue Title</th>
              <th {...thProps('room')}>Location</th>
              <th {...thProps('cat')}>Category</th>
              <th {...thProps('priority')}>Priority</th>
              <th {...thProps('assignee')}>Assigned Staff</th>
              <th {...thProps('status')}>Status</th>
              <th {...thProps('date')}>Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {paged.map(x => (
              <tr key={x.id} className={x.priority === 'Urgent' && x.status !== 'Completed' ? 'dmg' : ''}>
                <td><b>{x.id}</b></td>
                <td>
                  <span
                    style={{ cursor: 'pointer', fontWeight: 600, color: 'var(--acc)' }}
                    onClick={() => setDetail(x)}
                    title="Click to view full description"
                  >
                    {x.title}
                  </span>
                  <div className="muted">By {x.by}</div>
                </td>
                <td>{x.room}</td>
                <td>{x.cat}</td>
                <td>
                  <select
                    className="inl"
                    value={x.priority}
                    onChange={e => updateField(x.id, 'priority', e.target.value)}
                  >
                    {PRI.map(p => (
                      <option key={p} value={p}>{p}</option>
                    ))}
                  </select>
                </td>
                <td>
                  <select
                    className="inl"
                    value={x.assignee || ''}
                    onChange={e => updateField(x.id, 'assignee', e.target.value)}
                  >

/* ============================================================
   PAGE: Reservations
   ============================================================ */
function Res({ db, mutate, notify, pref, clear }) {
  const [q, setQ] = useState('');
  const [fs, setFs] = useState('All');
  const [fd, setFd] = useState('');
  const [m, setM] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const { sortFn, thProps } = useSort('date', 'desc');

  useEffect(() => {
    if (pref) {
      setM(true);
      if (clear) clear();
    }
  }, [pref]);

  const ResF = [
    { k: 'room', l: 'Target Room', opts: db.rooms.map(r => r.code) },
    { k: 'who', l: 'Reserved By (Faculty / Student / Dept)' },
    { k: 'purpose', l: 'Event Purpose / Description' },
    { k: 'date', l: 'Reservation Date', t: 'date' },
    { k: 'start', l: 'Start Time (HH:MM)', t: 'time' },
    { k: 'end', l: 'End Time (HH:MM)', t: 'time' },
    { k: 'status', l: 'Status', opts: RES_STATS }
  ];

  const list = db.reservations.filter(r => {
    const matchS = fs === 'All' || r.status === fs;
    const matchD = !fd || r.date === fd;
    const matchQ = (r.room + r.who + r.purpose + r.id).toLowerCase().includes(q.toLowerCase());
    return matchS && matchD && matchQ;
  });

  const sorted = sortFn(list);
  const { paged, Pager } = usePagination(sorted, 10);

  const checkConflict = (room, date, start, end, excludeId = null) => {
    const newStart = toMinutes(start);
    const newEnd = toMinutes(end);
    return db.reservations.find(r => {
      if (r.id === excludeId || r.room !== room || r.date !== date || r.status === 'Rejected') {
        return false;
      }
      const existingStart = toMinutes(r.start);
      const existingEnd = toMinutes(r.end);
      return newStart < existingEnd && newEnd > existingStart;
    });
  };

  const save = v => {
    if (toMinutes(v.start) >= toMinutes(v.end)) {
      notify('Error: End time must be strictly after start time');
      return false;
    }
    const isNew = !db.reservations.some(r => r.id === v.id);
    const item = { ...v };
    if (isNew) {
      item.id = 'R' + (db.reservations.length + 1);
      if (!item.status) item.status = 'Pending';
    }

    if (item.status === 'Approved') {
      const conflict = checkConflict(item.room, item.date, item.start, item.end, item.id);
      if (conflict) {
        notify(`Scheduling Conflict! Room already booked by ${conflict.who} (${conflict.start}–${conflict.end})`);
        return false;
      }
    }

    mutate(
      d => ({
        ...d,
        reservations: isNew
          ? [item, ...d.reservations]
          : d.reservations.map(r => (r.id === item.id ? { ...r, ...item } : r))
      }),
      `${isNew ? 'Booking requested' : 'Booking updated'}: ${item.room} for ${item.who}`
    );
    notify('Reservation saved successfully');
  };

  const setStatus = (r, status) => {
    if (status === 'Approved') {
      const conflict = checkConflict(r.room, r.date, r.start, r.end, r.id);
      if (conflict) {
        notify(`Cannot Approve: Conflict with ${conflict.who} (${conflict.start}–${conflict.end})`);
        return;
      }
    }
    mutate(
      d => ({
        ...d,
        reservations: d.reservations.map(x => (x.id === r.id ? { ...x, status } : x))
      }),
      `Reservation ${r.id} for ${r.room} set to ${status}`
    );
    notify(`Reservation marked as ${status}`);
  };

  const del = r => {
    mutate(
      d => ({ ...d, reservations: d.reservations.filter(x => x.id !== r.id) }),
      `Reservation deleted: ${r.id} (${r.room})`
    );
    notify('Reservation deleted');
    setConfirm(null);
  };

  return (
    <div className="fade-in">
      <Toolbar q={q} setQ={setQ} onAdd={() => setM(true)} label="New Booking">
        <input
          type="date"
          value={fd}
          onChange={e => setFd(e.target.value)}
          title="Filter by specific date"
        />
        {fd && (
          <button className="ghost" onClick={() => setFd('')}>
            Clear Date Filter
          </button>
        )}
      </Toolbar>

      <div className="tabs">
        {['All', ...RES_STATS].map(s => {
          const count = s === 'All' ? db.reservations.length : db.reservations.filter(r => r.status === s).length;
          return (
            <button key={s} className={fs === s ? 'on' : ''} onClick={() => setFs(s)}>
              {s} ({count})
            </button>
          );
        })}
      </div>

      <div className="card wrap">
        <table>
          <thead>
            <tr>
              <th {...thProps('id')}>ID</th>
              <th {...thProps('room')}>Room</th>
              <th {...thProps('who')}>Requested By</th>
              <th {...thProps('purpose')}>Purpose</th>
              <th {...thProps('date')}>Date</th>
              <th>Time Window</th>
              <th {...thProps('status')}>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {paged.map(r => {
              const roomObj = db.rooms.find(x => x.code === r.room);
              return (
                <tr key={r.id}>
                  <td><b>{r.id}</b></td>
                  <td>
                    <b>{r.room}</b>
                    {roomObj && <div className="muted">{roomObj.name}</div>}
                  </td>
                  <td>{r.who}</td>
                  <td>{r.purpose}</td>
                  <td>{r.date}</td>
                  <td>{r.start} – {r.end}</td>
                  <td><Badge v={r.status} /></td>
                  <td className="acts-c">
                    {r.status !== 'Approved' && (
                      <button
                        className="ghost success-ghost"
                        onClick={() => setStatus(r, 'Approved')}
                        title="Approve booking"
                      >
                        Approve
                      </button>
                    )}
                    {r.status !== 'Rejected' && (
                      <button
                        className="ghost danger"
                        onClick={() => setStatus(r, 'Rejected')}
                        title="Reject booking"
                      >
                        Reject
                      </button>
                    )}
                    <button className="ghost" onClick={() => setEditItem(r)}>
                      Edit
                    </button>
                    <button className="ghost danger" onClick={() => setConfirm(r)}>
                      Delete
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {!sorted.length && <Empty />}
        <Pager />
      </div>

      {(m || editItem) && (
        <FormModal
          title={m ? 'Create Room Reservation' : `Edit Reservation: ${editItem.id}`}
          fields={m ? ResF.filter(x => x.k !== 'status') : ResF}
          init={
            m
              ? {
                  room: pref || db.rooms[0]?.code,
                  date: today(),
                  start: '09:00',
                  end: '11:00',
                  purpose: '',
                  who: ''
                }
              : editItem
          }
          onSave={save}
          onClose={() => {
            setM(false);
            setEditItem(null);
          }}
        />
      )}

      {confirm && (
        <ConfirmDialog
          message={`Are you sure you want to cancel and delete reservation ${confirm.id} for ${confirm.room}?`}
          onConfirm={() => del(confirm)}
          onCancel={() => setConfirm(null)}
        />
      )}
    </div>
  );
}

   ============================================================ */
function Reports({ db, notify }) {
  const [downloadMsg, setDownloadMsg] = useState('');

  const calcBookedHours = b => {
    const rs = db.rooms.filter(r => r.building === b.code);
    return db.reservations
      .filter(r => r.status === 'Approved' && rs.some(x => x.code === r.room))
      .reduce((s, r) => s + (toMinutes(r.end) - toMinutes(r.start)) / 60, 0);
  };

  const rows = db.buildings.map(b => {
    const rs = db.rooms.filter(r => r.building === b.code);
    const labRooms = rs.filter(r => r.type === 'Laboratory');
    const eq = db.equipment.filter(e => rs.some(r => r.code === e.room));
    const ready = eq.length
      ? Math.round(
          (eq.filter(e => e.available && e.condition !== 'Damaged').length / eq.length) * 100
        )
      : null;
    return {
      b,
      rooms: rs.length,
      labs: labRooms.length,
      ready,
      open: db.requests.filter(m => m.status !== 'Completed' && rs.some(r => r.code === m.room)).length,
      hrs: Math.round(calcBookedHours(b))
    };
  });

  const exportCSV = () => {
    const headers = ['Building Name', 'Code', 'Total Rooms', 'Labs', 'Equipment Ready %', 'Open Requests', 'Booked Hours'];
    const csvContent = [
      headers.join(','),
      ...rows.map(r =>
        [
          `"${r.b.name}"`,
          r.b.code,
          r.rooms,
          r.labs,
          r.ready !== null ? r.ready + '%' : 'N/A',
          r.open,
          r.hrs
        ].join(',')
      )
    ].join('\n');

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', `campus360_facility_report_${today()}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    notify('Report exported to CSV');
    setDownloadMsg('CSV Downloaded!');
    setTimeout(() => setDownloadMsg(''), 2500);
  };

  const printReport = () => {
    window.print();
  };

  return (
    <div className="fade-in">
      <div className="bar-row" style={{ justifyContent: 'flex-end', marginBottom: 4 }}>
        <button className="ghost" onClick={printReport}>
          🖨️ Print / Save PDF
        </button>
        <button onClick={exportCSV}>
          📥 Export CSV {downloadMsg && `(${downloadMsg})`}
        </button>
      </div>

      <div className="grid2">
        <div className="card">
          <h2>Approved Booking Hours by Building</h2>
          <Bars data={rows.map(r => ({ l: r.b.code, v: r.hrs }))} />
        </div>
        <div className="card">
          <h2>Maintenance Work Orders by Category</h2>
          <Bars
            data={CATS.map(c => ({
              l: c.slice(0, 5),
              v: db.requests.filter(m => m.cat === c).length
            }))}
          />
        </div>
      </div>

      <div className="grid2">
        <div className="card">
          <h2>Maintenance Requests by Priority</h2>
          <Donut
            parts={PRI.map(p => ({
              l: p,
              v: db.requests.filter(m => m.priority === p).length,
              c: TONE[p]
            }))}
          />
        </div>
        <div className="card">
          <h2>Facilities Space Distribution</h2>
          <Donut
            parts={[
              { l: 'Classrooms', v: db.rooms.filter(r => r.type === 'Classroom').length, c: '#4f8a7b' },
              { l: 'Laboratories', v: db.rooms.filter(r => r.type === 'Laboratory').length, c: '#8a6fb8' }
            ]}
          />
        </div>
      </div>

      <div className="card wrap">
        <h2>University Campus Buildings & Facilities Metrics</h2>
        <table>
          <thead>
            <tr>
              <th>Building</th>
              <th>Rooms</th>
              <th>Labs</th>
              <th>Equipment Readiness</th>
              <th>Open Requests</th>
              <th>Approved Booking Hours</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.b.code}>
                <td>
                  <b>{r.b.name}</b> ({r.b.code})
                </td>
                <td>{r.rooms}</td>
                <td>{r.labs}</td>
                <td>
                  {r.ready === null ? (
                    <span className="muted">N/A</span>
                  ) : (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div
                        style={{
                          background: '#eef3f0',
                          borderRadius: 6,
                          height: 8,
                          width: 120,
                          overflow: 'hidden'
                        }}
                      >
                        <div
                          style={{
                            width: `${r.ready}%`,
                            background: r.ready > 75 ? '#5a9a6e' : '#d69a3c',
                            height: 8,
                            borderRadius: 6
                          }}
                        />
                      </div>
                      <span className="muted" style={{ minWidth: 32 }}>
                        {r.ready}%
                      </span>
                    </div>
                  )}
                </td>
                <td>{r.open}</td>
                <td>{r.hrs} hrs</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

                  {alerts.slice(0, 5).map((a, i) => (
                    <div
                      key={i}
                      className="ddi"
                      style={{ cursor: 'pointer' }}
                      onClick={() => {
                        if (a.page) go(a.page);
                      }}
                    >
                      <span style={{ fontSize: 16 }}>{a.i}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 600 }}>{a.t}</div>
                        <div className="muted">{a.sub}</div>
                      </div>
                    </div>
                  ))}
                  {!alerts.length && <div className="ddi muted">All clear — no pending alerts</div>}
                  <div className="dd-foot">
                    <button className="ghost" onClick={() => go('not')}>
                      View All Alerts & Activity Log →
                    </button>
                  </div>
                </div>
              )}
            </div>

            <div className="avatar" title="Signed in as Facilities Manager">
              FM
            </div>
          </div>
        </header>

        <div className="body">
          {page === 'dash' && <Dash db={db} alerts={alerts} go={go} reserve={reserve} />}
          {page === 'bld' && <Buildings {...P} />}
          {page === 'cls' && <Rooms {...P} type="Classroom" />}
          {page === 'lab' && <Rooms {...P} type="Laboratory" />}
          {page === 'eq' && <Equip {...P} />}
          {page === 'mx' && <Maint {...P} />}
          {page === 'res' && <Res {...P} pref={pref} clear={() => setPref(null)} />}
          {page === 'rep' && <Reports db={db} notify={notify} />}
          {page === 'not' && <Notes db={db} alerts={alerts} mutate={mutate} notify={notify} go={go} />}
        </div>
      </main>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
